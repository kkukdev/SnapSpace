name: postgres-fastapi

services:
  postgres:
    image: postgres:14
    container_name: postgres-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      LC_CTYPE: C.UTF-8
      LC_COLLATE: C.UTF-8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build: .
    container_name: fastapi-app
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - .:/app
      - ../storage:/project_root/storage  # /app/storage로 통일
    command: ["python", "-m", "app.main"]
    working_dir: /app
    networks:
      - app-network

  ai-server:
    build:
      context: ../AI
      dockerfile: Dockerfile
    container_name: ai-server
    ports:
      - "8001:8001"
    environment:
      - BACKEND_WEBSOCKET_URL=ws://backend:8000/ws
      - HOST=0.0.0.0
      - PORT=8001
      - UPLOADS_DIRECTORY=project_root/storage/uploads
      - OUTPUTS_DIRECTORY=project_root/storage/outputs
      - MAX_CONCURRENT_TASKS=3
      - LOG_LEVEL=INFO
    depends_on:
      - backend
    volumes:
      - ../storage:/project_root/storage  # /app/storage로 통일
    working_dir: /app
    command: ["python", "-m", "app.main"]
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge